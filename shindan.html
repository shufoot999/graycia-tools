<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f8fb;
  --bg-card: #ffffff;
  --bg-light: #f5f9fb;
  --border: #d8e4e9;
  --accent: #007f9f;
  --accent-dark: #006b88;
  --accent-light: #eaf6fa;
  --highlight: rgba(255, 213, 79, 0.35);
  /* 真っ黒は避け、わずかに明度を上げた濃グレーにする */
  --text: #1f1f1f;
  --text-sub: #566674;
  --text-dim: #8a99a5;
  /* 影は輪郭を作るためでなく、面をわずかに浮かせるためだけに使う */
  --shadow-card: 0 4px 20px rgba(15, 39, 66, 0.06);
  --shadow-raised: 0 8px 26px rgba(15, 39, 66, 0.10);
  --radius: 16px;
  --radius-cta: 14px;
  --radius-tag: 7px;
}

html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  /* 画面上部にごく淡い光を置き、白背景の平坦さを避ける */
  background:
    radial-gradient(circle at 50% -10%, rgba(0,127,159,0.09), transparent 32rem),
    var(--bg);
  color: var(--text);
  min-height: 100%;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

#app {
  /* 全幅化する要素がこの値を参照するため、変数で一元管理する */
  --app-pad: 22px;
  max-width: 440px;
  margin: 0 auto;
  padding: 0 var(--app-pad);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: 0 0 45px rgba(28, 65, 84, 0.06);
}

.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  padding: 24px 0;
  animation: fadeSlideIn 0.26s cubic-bezier(.22,.61,.36,1);
}
.screen.active { display: flex; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Progress --- */
.progress-bar {
  width: 100%;
  height: 4px;
  background: #e8eef1;
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 13px;
  color: var(--accent);
  font-weight: 800;
  margin-bottom: 9px;
  letter-spacing: 0.08em;
}

/* --- Landing --- */
.landing {
  justify-content: flex-start;
  align-items: stretch;
  /* 車の画像を外したため、見出しも他の要素に合わせて中央寄せにする */
  text-align: center;
  min-height: 100%;
  gap: 0;
  /* 左右いっぱいに背景を敷くため #app の padding を打ち消し、内側で取り直す */
  width: calc(100% + var(--app-pad) * 2);
  margin: 0 calc(var(--app-pad) * -1);
  padding: 0 var(--app-pad) 24px;
  position: relative;
  background-image: url('images/bg_top.jpg');
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

/* --- ヘッダー: 白地にロゴ左・ブランド名右 --- */
.landing-header {
  width: 100%;
  padding: 18px 0 4px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

/* ヘッダー以外を縦中央に配置する */
.landing-body {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  /* 余白を要素間と上下へ均等に配り、中央に固まって見えるのを避ける */
  justify-content: space-evenly;
  gap: 0;
  padding: 8px 0 12px;
}
.landing-headline { flex-shrink: 0; }

.landing-brand {
  font-size: 19px;
  letter-spacing: 0.24em;
  text-indent: 0.24em;
  color: var(--text-dim);
  font-weight: 700;
}
.landing-logo {
  height: 46px;
  width: auto;
  display: block;
}
.landing-title {
  font-size: 27px;
  font-weight: 800;
  line-height: 1.42;
  letter-spacing: -0.02em;
  color: var(--text);
}
.landing-title em {
  font-style: normal;
  color: var(--accent);
}
.landing-sub {
  font-size: 13.5px;
  color: var(--text-sub);
  line-height: 1.8;
  margin-top: 16px;
}
.landing-badges {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
}
.landing-badge {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 0 8px;
  position: relative;
}
.landing-badge + .landing-badge::before {
  content: "";
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 2px;
  width: 1px;
  background: #dce7ec;
}
.landing-badge-icon {
  color: var(--accent);
  line-height: 0;
}
.landing-badge-icon svg {
  width: 68px;
  height: 68px;
}
.landing-badge-text {
  /* CTAボタンの文字(16px)と同サイズに揃える */
  font-size: 16px;
  font-weight: 600;
  color: var(--text-sub);
  line-height: 1.4;
  text-align: center;
  word-break: auto-phrase;
}
/* --- Buttons --- */
.btn-primary {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  min-height: 56px;
  padding: 15px 28px;
  background: linear-gradient(180deg, #0788a8 0%, #007b9b 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  letter-spacing: 0.05em;
  box-shadow: 0 10px 22px rgba(0,127,159,.18);
  transition: transform 0.15s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { transform: scale(0.98); opacity: 0.92; }
.btn-primary:disabled { opacity: 0.38; box-shadow: none; pointer-events: none; }

/* ラベルは中央に置き、矢印だけを右端へ絶対配置する */
.btn-hero {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 0;
}
.btn-arrow {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  line-height: 0;
  pointer-events: none;
}
.btn-arrow svg {
  width: 18px;
  height: 18px;
}

.btn-line {
  background: #06C755;
  box-shadow: 0 10px 22px rgba(6,199,85,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  max-width: 100%;
}
.btn-line svg { width: 24px; height: 24px; flex-shrink: 0; }

.btn-outline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 50px;
  padding: 14px 24px;
  background: #fff;
  color: var(--text-sub);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}
.btn-outline svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-outline:active { border-color: var(--accent); color: var(--accent); }

.btn-back {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 4px;
  -webkit-tap-highlight-color: transparent;
}
.btn-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* --- Question --- */
.q-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 25px;
  line-height: 1.4;
  letter-spacing: -0.02em;
  color: var(--text);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.option {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 62px;
  padding: 14px 15px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: border-color 0.17s, background 0.17s, box-shadow 0.17s;
  -webkit-tap-highlight-color: transparent;
}
.option:active, .option.selected {
  border-color: var(--accent);
  background: #f2fafc;
  box-shadow: 0 4px 20px rgba(0,127,159,.10), inset 0 0 0 1px rgba(0,127,159,.35);
}
.option-icon {
  width: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent);
}
.option-icon svg {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
}
/* 複数選択のチェックボックス。未選択は枠のみ、選択中はアクセント色で塗る */
.option-check {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: #fff;
  color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.option-check svg {
  width: 14px;
  height: 14px;
}
.option.selected .option-check {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.option-text { flex: 1; min-width: 0; }
.option-label {
  font-size: 15px;
  font-weight: 750;
  color: var(--text);
}
.option-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* --- Car search (Q1) --- */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-input {
  width: 100%;
  padding: 14px 42px 14px 44px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  stroke: var(--text-dim);
  fill: none;
  stroke-width: 2;
}
.search-chevron {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #b6c6ce;
  line-height: 0;
  pointer-events: none;
}
.search-chevron svg { width: 16px; height: 16px; }

.search-candidates {
  display: none;
  max-height: 280px;
  overflow-y: auto;
  margin-top: 8px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.search-candidates.open { display: block; }

.candidate-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
}
.candidate-item:last-child { border-bottom: none; }
.candidate-item:active { background: var(--accent-light); }
.candidate-car { font-size: 14px; font-weight: 500; color: var(--text); }
.candidate-maker { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.candidate-size {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-light);
  padding: 3px 10px;
  border-radius: 6px;
  flex-shrink: 0;
}
.search-no-result {
  padding: 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

.selected-car {
  display: none;
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.selected-car.show { display: flex; justify-content: space-between; align-items: center; }
.selected-car-info {}
.selected-car-name { font-size: 15px; font-weight: 600; color: var(--text); }
.selected-car-maker { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.selected-car-size {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}
.selected-car-clear {
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  margin-top: 8px;
  text-align: right;
}

.size-fallback {
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.size-fallback-label {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 12px;
}
.size-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.size-btn {
  position: relative;
  min-height: 96px;
  padding: 14px 7px 12px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  box-shadow: var(--shadow-card);
  transition: border-color 0.17s, background 0.17s, box-shadow 0.17s;
  -webkit-tap-highlight-color: transparent;
}
.size-btn.selected {
  border-color: var(--accent);
  border-width: 1.5px;
  background: #f2fafc;
  box-shadow: 0 4px 20px rgba(0,127,159,.10);
}
.size-btn-car {
  color: #b6c6ce;
  line-height: 0;
  margin-top: 3px;
  transition: color 0.18s;
}
.size-btn-car svg { width: 40px; height: 20px; }
.size-btn.selected .size-btn-car { color: var(--accent); }
/* 選択中だけ右下にチェックを出す */
.size-btn-check {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(.7);
  transition: opacity 0.18s, transform 0.18s;
}
.size-btn-check svg { width: 10px; height: 10px; }
.size-btn.selected .size-btn-check { opacity: 1; transform: scale(1); }
.size-btn:active, .size-btn.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.size-btn-size {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
.size-btn-ex {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

.q1-next, .q3-next {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 24px;
  position: sticky;
  bottom: 14px;
  z-index: 4;
}

/* --- Result --- */
.result-header {
  text-align: center;
  margin-bottom: 28px;
}
.result-header-label {
  display: inline-block;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.1em;
  font-weight: 700;
  background: var(--accent-light);
  border-radius: var(--radius-tag);
  padding: 4px 12px;
  margin-bottom: 12px;
}
.result-header-title {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.45;
  letter-spacing: -0.02em;
  color: var(--text);
}
/* ランディングの見出しと同じく、主題側だけアクセント色にする */
.result-header-title span { color: var(--accent); }

.result-card {
  background: #fff;
  border: 0;
  border-radius: 20px;
  padding: 26px 20px 22px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 14px 38px rgba(18,72,96,.12);
}
.result-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 5px;
  background: linear-gradient(90deg, #007f9f, #35a9c2);
}

.result-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
}
.result-badge.recommended {
  background: var(--accent);
  color: #fff;
}

.result-menu-name {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.03em;
}
.result-catchcopy {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.5;
  margin-bottom: 10px;
}
.result-duration {
  display: inline-flex;
  padding: 4px 9px;
  background: #eff8fb;
  border-radius: 7px;
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 17px;
}
.result-image {
  margin: 0 -20px 18px;
  overflow: hidden;
  background: var(--bg-light);
  line-height: 0;
}
.result-image img {
  width: 100%;
  height: auto;
  display: block;
}
.result-desc {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.85;
  margin-bottom: 20px;
}
.result-reason {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.8;
  background: linear-gradient(135deg, #eff8fb, #f7fbfd);
  border-left: 3px solid #68b5ca;
  border-radius: 12px;
  padding: 15px 16px;
  margin-bottom: 20px;
}
.result-reason em {
  font-style: normal;
  color: var(--accent);
  font-weight: 600;
}

/* 特徴は4つの正方形カード。アイコンとラベルを縦積みにして4列で並べる */
.result-features {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.feature-card {
  background: var(--accent-light);
  border-radius: 10px;
  padding: 12px 4px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}
.feature-card-icon {
  color: var(--accent);
  line-height: 0;
}
.feature-card-icon svg {
  width: 22px;
  height: 22px;
}
.feature-card-text {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.35;
  word-break: auto-phrase;
}

.result-price-section {
  border-top: 1px solid var(--border);
  padding-top: 20px;
}
.result-price-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.result-price-label {
  font-size: 13px;
  color: var(--text-sub);
  min-width: 0;
  overflow-wrap: anywhere;
}
.result-price-value {
  font-size: 25px;
  letter-spacing: -0.02em;
  font-weight: 800;
  color: var(--text);
}
.result-price-tax {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
}
.result-annual {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 15px;
  background: linear-gradient(135deg, #eef8fb, #e4f3f8);
  border: 1.5px solid var(--accent);
  border-radius: 13px;
  margin-top: 12px;
}
.annual-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: 1;
}
.annual-label {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
}
.annual-value {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1.3;
  letter-spacing: -0.02em;
}
.annual-note {
  font-size: 10.5px;
  color: var(--text-dim);
  margin-top: 2px;
}
.budget-note {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fef9e7;
  border: 1px solid #f0e0a0;
  border-radius: 10px;
  font-size: 12px;
  color: #7a6a1f;
  line-height: 1.6;
}

/* --- Premium suggestion --- */
.premium-card {
  background: #fff;
  border: 0;
  border-radius: 20px;
  padding: 23px 20px;
  margin-bottom: 20px;

  font-weight: 700;

  color: #fff;
}
.premium-name {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.4;
}
.premium-desc {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.8;
  margin-bottom: 14px;
}
.premium-price-section {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 0;
  margin-bottom: 14px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.premium-price-label {
  font-size: 12px;
  color: var(--text-sub);
  min-width: 0;
  overflow-wrap: anywhere;
}
.premium-price-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
}
/* プレミアムの画像。おすすめカードと同じくカード幅いっぱいに置く */
.premium-image {
  margin: 0 -20px 16px;
  overflow: hidden;
  background: var(--bg-light);
  line-height: 0;
}
.premium-image img {
  width: 100%;
  height: auto;
  display: block;
}

.premium-includes-section {
  margin-top: 4px;
}
.premium-includes-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 8px;
}
.premium-includes-title.store-exclusive {
  margin-top: 10px;
  color: var(--accent);
}
/* 含まれるサイドメニュー: アイコン＋ラベルのグリッド */
.premium-includes {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
  padding: 12px 8px;
  background: var(--bg-light);
  border-radius: 12px;
}
.include-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  text-align: center;
}
.include-icon { color: var(--accent); line-height: 0; }
.include-icon svg { width: 24px; height: 24px; }
.include-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-sub);
  line-height: 1.3;
}

.premium-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}
.premium-includes-tag {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-light);
  border-radius: 7px;
  padding: 5px 9px;
  font-weight: 600;
}
.exclusive-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.premium-includes-tag.exclusive {
  color: #b8860b;
  background: #fdf6e3;
  font-size: 11px;
  font-weight: 600;
  border-radius: var(--radius-tag);
  padding: 5px 10px;
}

/* --- Comparison --- */
.comparison {
  margin: 26px 0 28px;
}
.comparison-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--text);
}

.compare-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  min-height: 82px;
  padding: 15px 17px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 15px rgba(17,66,92,.025);
}
.compare-card.highlight {
  border-color: var(--accent);
  background: #eef8fb;
  box-shadow: 0 7px 20px rgba(0,127,159,.08);
}
.compare-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.compare-duration {
  font-size: 12px;
  color: var(--text-dim);
}
.compare-right { text-align: right; }
.compare-price {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 1px;
}
.compare-annual {
  font-size: 15px;
  color: var(--accent);
  font-weight: 800;
  letter-spacing: -0.01em;
}
.compare-badge {
  font-size: 10px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  border-radius: 4px;
  padding: 2px 8px;
  margin-left: 8px;
}
.compare-over {
  font-size: 10px;
  color: #b8860b;
  margin-top: 2px;
}

/* --- CTA --- */
.cta-section {
  margin-top: 8px;
  padding: 24px 0 40px;
}
.cta-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cta-note {
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  margin-top: 16px;
  background: var(--accent-light);
  padding: 8px 12px;
  border-radius: 8px;
}

/* --- CTA（診断おつかれさまでした） --- */
.cta-illust {
  line-height: 0;
  margin: 4px auto 18px;
  max-width: 300px;
}
.cta-illust svg {
  width: 100%;
  height: auto;
  display: block;
}
.cta-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  text-align: center;
  margin-bottom: 10px;
}
.cta-lead {
  font-size: 13.5px;
  color: var(--text-sub);
  line-height: 1.8;
  text-align: center;
  margin-bottom: 18px;
}
.share-copy {
  background: linear-gradient(135deg,#edf8fb,#e7f4f8);
  border: 0;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  text-align: center;
  box-shadow: var(--shadow-card);
}
.share-copy-text {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 12px;
}
.btn-copy {
  background: var(--accent);
  min-height: 48px;
  box-shadow: 0 8px 18px rgba(0,127,159,.14);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  font-size: 14px;
  font-weight: 700;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-copy:active { transform: scale(0.98); opacity: 0.92; }
.btn-copy svg { width: 17px; height: 17px; flex-shrink: 0; }

.share-section {
  border-top: 1px solid var(--border);
  padding-top: 20px;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.share-text {
  font-size: 13px;
  color: var(--text-dim);
}

.footer {
  text-align: center;
  padding: 20px 0;
  margin-top: auto;
}
.landing .footer { margin-top: 0; padding: 0; }
.landing .footer-brand { color: var(--text-sub); }
.landing .footer-sub { color: #9fb0ba; }
.footer-brand {
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--text-dim);
  font-weight: 600;
}
.footer-sub {
  font-size: 11px;
  color: #ccc;
  margin-top: 4px;
}

/* --- 結果画面のフローティング誘導 --- */
/* 年間コストが見えたら下部に固定表示し、完了セクション到達で消える */
.float-cta {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translate(-50%, 90px);
  width: min(calc(100% - 28px), 412px);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(15, 39, 66, 0.20);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.28s cubic-bezier(.22,.61,.36,1), opacity 0.28s;
  z-index: 60;
  -webkit-tap-highlight-color: transparent;
}
.float-cta.show {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}
.float-cta:active { transform: translate(-50%, 0) scale(0.98); }
.float-cta-icon {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #06C755;
  display: grid;
  place-items: center;
}
.float-cta-icon svg { width: 21px; height: 21px; }
.float-cta-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  line-height: 1.45;
}
.float-cta-text strong {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
}
.float-cta-text span {
  font-size: 11.5px;
  color: var(--text-sub);
}
.float-cta-chev {
  flex-shrink: 0;
  color: #b6c6ce;
  line-height: 0;
}
.float-cta-chev svg { width: 16px; height: 16px; }

.toast {
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: 10px;
  opacity: 0;
  transition: transform 0.3s, opacity 0.3s;
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  .screen { animation: none; }
  * { transition-duration: 0.01ms !important; }
}

/* --- 画面幅への対応 --- */
/* 縦に余裕がない端末（iPhone SE等）では余白を詰めてCTAを画面内に収める。
   max-width も条件に入れる。幅の広いPCで高さだけ低い場合に発動すると、
   左右パディングまで0になりコンテンツが画面端に張り付くため */
@media (max-height: 730px) and (max-width: 899px) {
  .landing { padding: 0 var(--app-pad) 14px; }
  .landing-logo { height: 44px; }
  .landing-header { padding: 18px 22px 16px; gap: 9px; }
  .landing-brand { font-size: 17px; }
  .landing-title { font-size: 24px; }
  .landing-sub { margin-top: 12px; font-size: 13px; }
  .landing-badges { margin-top: 18px; }
  .landing-badge-icon svg { width: 52px; height: 52px; }
  .landing-badge-text { font-size: 15px; }
  .landing .footer { margin-top: 18px; padding: 8px 0 2px; }
  .footer-sub { font-size: 10px; }
}

/* 小型端末（iPhone SE等）では余白と見出しを詰める */
@media (max-width: 360px) {
  #app { --app-pad: 16px; }
  .landing-title { font-size: 25px; }
  .landing-badge-text { font-size: 15px; }
  .q-title { font-size: 22px; }
  .result-menu-name { font-size: 25px; }
  .feature-card-text { font-size: 9.5px; }
}

/* PC等の広い画面では、カード状に浮かせて表示する */
@media (min-width: 700px) {
  body { padding: 24px 20px; }
  .landing-header {
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
  }
  #app {
    min-height: calc(100vh - 48px);
    border-radius: 24px;
    /* overflow:hidden は使わない。#appがスクロールコンテナになり
       「次へ」ボタンの position:sticky が効かなくなるため。
       角のはみ出しは、はみ出す要素側で個別に丸める */
  }
}

/* =========================================================
   PCレイアウト（900px以上）
   幅を広げるだけだと要素が横に間延びするため、増えた横幅は
   「1行あたりの文字数」ではなく「並べる数」に使う。
   ========================================================= */
@media (min-width: 900px) {
  body { padding: 32px 32px; }
  #app {
    --app-pad: 48px;
    max-width: 1000px;
    min-height: calc(100vh - 64px);
  }
  /* 縦の余りは中央に集める。画面下だけが空くのを避ける */
  .screen { justify-content: center; }
  #screen-result.active { justify-content: start; }

  /* --- トップ: 見出しとメリットを左右に配置 --- */
  /* 親(#app)の高さがmin-heightのみだと min-height:100% が解決されず
     背景が途中で切れるため、PCではビューポート基準の高さを与える */
  .landing {
    min-height: calc(100vh - 64px);
    background-size: cover;
    background-position: center;
  }
  .landing-header { padding: 26px 0 10px; }
  .landing-logo { height: 54px; }
  .landing-brand { font-size: 22px; }
  .landing-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "headline badges"
      "headline cta"
      "footer   footer";
    align-content: center;
    align-items: center;
    column-gap: 56px;
    row-gap: 20px;
    text-align: left;
    padding: 24px 0 32px;
  }
  .landing-headline { grid-area: headline; }
  .landing-badges   { grid-area: badges; align-self: end; }
  .btn-hero         { grid-area: cta; align-self: start; max-width: 380px; }
  .landing .footer  { grid-area: footer; text-align: center; margin-top: 24px; }
  /* 左列の幅に合わせて可変にする。固定40pxだと900px付近で
     「あなたにぴったり/の」のように不自然な位置で折り返す */
  .landing-title { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.35; }
  .landing-sub { font-size: 16px; margin-top: 18px; }

  /* --- 設問: 選択肢を2列に並べる --- */
  .q-title { font-size: 30px; }
  .q-subtitle { font-size: 15px !important; }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-content: start;
  }
  .option { min-height: 76px; }
  .option-label { font-size: 16px; }
  .search-input { font-size: 16px; min-height: 62px; }
  .size-buttons { grid-template-columns: repeat(6, 1fr); }
  .size-btn { min-height: 118px; }
  .size-btn-car svg { width: 46px; height: 23px; }
  /* 決定ボタンは中央寄せで幅を絞る（全幅だと押しづらい） */
  .q1-next, .q3-next, .btn-primary {
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  /* --- 結果: おすすめを左、プレミアムと比較を右に --- */
  /* .screen{display:none} より詳細度が高いIDで display を指定すると
     非表示にならないため、必ず .active を伴わせる */
  #screen-result.active {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    /* 明示的な行を作り、右列は自動で縦積みさせる */
    grid-template-areas:
      "back     back"
      "header   header"
      "main     premium"
      "main     compare"
      "cta      cta"
      "foot     foot";
    grid-template-rows: auto auto auto 1fr auto auto;
    column-gap: 32px;
    align-items: start;
  }
  #screen-result.active > .btn-back      { grid-area: back; }
  #screen-result.active > .result-header { grid-area: header; }
  #screen-result.active > .result-card   { grid-area: main; }
  #screen-result.active > .premium-card  { grid-area: premium; }
  #screen-result.active > .comparison    { grid-area: compare; margin-top: 0; }
  #screen-result.active > .cta-section   { grid-area: cta; }
  #screen-result.active > .footer        { grid-area: foot; }
  .result-header-title { font-size: 32px; }
  .result-menu-name { font-size: 34px; }
  .result-image { margin: 0 -48px 20px; }
  .result-card { padding: 30px 48px 26px; }
  .premium-image { margin: 0 -20px 16px; }
  .comparison { margin-top: 20px; }
  .premium-includes { grid-template-columns: repeat(7, 1fr); }
  .cta-section { max-width: 560px; margin-left: auto; margin-right: auto; }
  .cta-illust { max-width: 340px; }
  .cta-title { font-size: 26px; }

  /* フローティング誘導はPCでも下部中央に */
  .float-cta { width: min(560px, calc(100% - 48px)); }
}

  var m = MENUS[menuKey];
  var price = m.prices[size];
  var maint = MAINT_PRICES[menuKey];
  if (maint) {
    var count = MAINT_COUNT[menuKey] || 2;
    return Math.round((price + maint[size] * count) / m.duration);
  }
  return Math.round(price / m.duration);
}

var allCars = [];
for (var maker in CAR_SIZES) {

    allCars.push({ maker: maker, car: car, size: cars[car] });

var searchInput = document.getElementById('carSearchInput');
var searchCandidates = document.getElementById('searchCandidates');

function searchCars(query) {
  if (!query.trim()) return [];
  var q = query.toLowerCase();
  return allCars.filter(function(c) {
    return c.car.toLowerCase().indexOf(q) !== -1 || c.maker.toLowerCase().indexOf(q) !== -1;
  }).sort(function(a, b) {
    var aName = a.car.toLowerCase();
    var bName = b.car.toLowerCase();
    var aRank = aName === q ? 0 : aName.indexOf(q) === 0 ? 1 : 2;
    var bRank = bName === q ? 0 : bName.indexOf(q) === 0 ? 1 : 2;
    return aRank - bRank;
  }).slice(0, 12);
}

searchInput.addEventListener('input', function() {
  var results = searchCars(this.value);
  if (!this.value.trim()) {
    searchCandidates.classList.remove('open');
    return;

  if (results.length === 0) {
    searchCandidates.innerHTML = '<div class="search-no-result">該当する車種が見つかりませんでした</div>';

var MENU_ORDER = ['crystal', 'fresh', 'dia2', 'iron', 'ex'];

function calcScores() {
  var scores = { crystal: 0, fresh: 0, dia2: 0, iron: 0, ex: 0 };

  // Q2: 単一選択
  var q2Answer = state.answers.q2;
  var q2Opts = QUESTIONS.q2.options;
  for (var i = 0; i < q2Opts.length; i++) {
    if (q2Opts[i].value === q2Answer && q2Opts[i].scores) {
      MENU_ORDER.forEach(function(k) { scores[k] += q2Opts[i].scores[k] || 0; });
      break;
    }
  }

  // Q3: 複数選択 → 選んだ分だけ加点
  var q3Answers = state.answers.q3 || [];
  var q3Opts = QUESTIONS.q3.options;
  q3Answers.forEach(function(val) {
    for (var i = 0; i < q3Opts.length; i++) {
      if (q3Opts[i].value === val && q3Opts[i].scores) {
        MENU_ORDER.forEach(function(k) { scores[k] += q3Opts[i].scores[k] || 0; });
        break;
      }
    }
  });

  return scores;
}

function getRecommendation() {
  var scores = calcScores();
  var size = state.selectedSize || 'M';
  var budget = state.answers.q4 || 999999;

  MENU_ORDER.forEach(function(key) {
    var m = MENUS[key];
    var price = m.prices[size];
    var annual = calcAnnualCost(key, size);
    if (price <= budget) {
      scores[key] += 3;
    } else if (annual <= budget) {
      scores[key] -= 1;
    } else {
      scores[key] -= 5;
    }
  });

  var sorted = MENU_ORDER.slice().sort(function(a, b) { return scores[b] - scores[a]; });

  var hasBudgetFit = false;
  for (var i = 0; i < sorted.length; i++) {
    var m = MENUS[sorted[i]];
    var p = m.prices[size];
    var a = calcAnnualCost(sorted[i], size);
    if (p <= budget || a <= budget) {
      hasBudgetFit = true;
      break;
    }
  }
  if (!hasBudgetFit) {
    sorted = MENU_ORDER.slice();
  }

  return { primary: sorted[0], order: sorted, scores: scores };
}

" cy="106.8" r="3.9" fill="#f5d5c0" stroke="#2b4a57" stroke-width="1.5"/> <circle cx="258" cy="80.5" r="12.8" fill="#f5d5c0"/> <path d="M242.7,97 L242.7,80.5 A15.3,15.3 0 0 1 273.3,80.5 L273.3,97 L268.2,91 L268.2,77 C263.8,78.5 252.2,78.5 247.8,77 L247.8,91 Z" fill="#2b4a57"/> <circle cx="253.5" cy="82" r="1.55" fill="#2b4a57"/> <circle cx="262.5" cy="82" r="1.55" fill="#2b4a57"/> <path d="M254.8,87.6 Q258,90.4 261.2,87.6" stroke="#2b4a57" stroke-width="1.6"/> </g> <circle cx="170" cy="84" r="35" fill="#007f9f"/> <path d="M152.5,84 L164.5,96 L188,70" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/> </svg></div>';
  html += '<div class="cta-title">診断おつかれさまでした!</div>';
  html += '<div class="cta-lead">お車に合った正確なお見積もりをお出しします。<br>' + (IS_FROM_LINE ? 'このLINEトークからお気軽にご相談ください。' : 'お気軽にご相談ください。') + '</div>';

  // 結果コピー（LINE動線の上に配置）
  html += '<div class="share-copy">';
  html += '<div class="share-copy-text">診断結果をコピーして<br>公式LINEに送るとスムーズです</div>';

  } else {
    html += '<div class="cta-buttons">';

    html += '<svg viewBox="0 0 24 24" fill="#fff"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>';

// === 結果画面のフローティング誘導 ===
// 年間コスト(.result-annual)が見えたら表示し、完了セクション(.cta-illust)に
// 到達したら消す。スクロールごとに座標で判定する（確実に動く決定的な方式）
var floatCtaState = null;
function setupFloatCta() {
  var bar = document.getElementById('floatCta');
  if (!bar) return;
  bar.classList.remove('show');
  floatCtaState = { annualSeen: false, done: false };
  updateFloatCta();
}
function updateFloatCta() {
  var bar = document.getElementById('floatCta');
  if (!bar || !floatCtaState || floatCtaState.done) return;
  var screen = document.getElementById('screen-result');
  if (!screen || !screen.classList.contains('active')) { bar.classList.remove('show'); return; }
  var annual = screen.querySelector('.result-annual');
  var goal = screen.querySelector('.cta-illust');
  if (!annual || !goal) return;
  var vh = window.innerHeight;
  if (annual.getBoundingClientRect().top < vh - 40) floatCtaState.annualSeen = true;
  if (goal.getBoundingClientRect().top < vh - 60) {
    // 一度ゴールに到達したら、この結果表示の間はもう出さない
    floatCtaState.done = true;
    bar.classList.remove('show');
    return;
  }
  bar.classList.toggle('show', floatCtaState.annualSeen);
}
window.addEventListener('scroll', updateFloatCta, { passive: true });
window.addEventListener('resize', updateFloatCta);
function floatCtaGo() {
  var goal = document.querySelector('#screen-result .cta-illust');
  if (goal) goal.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// LINE内から開いた場合は文言を変える（LINEボタンは表示されないため）
(function() {
  var sub = document.getElementById('floatCtaSub');
  if (sub && IS_FROM_LINE) sub.textContent = 'このままトークでお気軽にご相談ください';
})();

function retake() {
  state.answers = {};
  state.selectedMaker = null;
  state.selectedCar = null;
  state.selectedSize = null;
  clearCar();
  document.querySelectorAll('#options-q3 .option').forEach(function(o) { o.classList.remove('selected'); });
  document.getElementById('q3Next').disabled = true;
  showScreen('landing');
}

function shareResult() {
  var rec = getRecommendation();
  var menu = MENUS[rec.primary];
  var size = state.selectedSize || 'M';
  var price = menu.prices[size];
  var annual = calcAnnualCost(rec.primary, size);

  var q2Label = '';
  QUESTIONS.q2.options.forEach(function(o) { if (o.value === state.answers.q2) q2Label = o.label; });
  var q3Labels = [];
  QUESTIONS.q3.options.forEach(function(o) { if ((state.answers.q3 || []).indexOf(o.value) !== -1) q3Labels.push(o.label); });
  var carName = getCarDisplayName();

  var text = '【コーティング診断結果】\n';
  text += 'お車: ' + carName + '（' + size + '）\n';
  text += '年式: ' + (q2Label || '-') + '\n';
  text += '気になること: ' + (q3Labels.join('・') || '-') + '\n';
  text += 'おすすめ: 「' + menu.name + '」(' + menu.durationLabel + ')\n';
  text += '参考価格: ' + fmt(price) + '（年間' + fmt(annual) + '）';

  function ksToast() {
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ksToast).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      ksToast();
    } catch (e) {}
  }
}

// 外部タップでドロップダウンを閉じる
document.addEventListener('click', function(e) {
  if (!e.target.closest('#carSearchSection')) {
    searchCandidates.classList.remove('open');
  }
});
