<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-card: #ffffff;
  --bg-light: #f0f7fa;
  --border: #d4e3ea;
  --accent: #007b9f;
  --accent-light: #e8f4f8;
  --highlight: rgba(255, 213, 79, 0.35);
  --text: #1a1a1a;
  --text-sub: #555555;
  --text-dim: #999999;
  --radius: 12px;
}

html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  padding: 24px 0;
  animation: fadeSlideIn 0.35s ease-out;
}
.screen.active { display: flex; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Progress --- */
.progress-bar {
  width: 100%;
  height: 4px;
  background: #e8eef1;
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}

/* --- Landing --- */
.landing {
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 40px;
  padding: 40px 0;
}
.landing-brand {
  font-size: 13px;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  font-weight: 600;
}
.landing-title {
  font-size: 26px;
  font-weight: 800;
  line-height: 1.5;
  letter-spacing: 0.02em;
  color: var(--text);
}
.landing-title em {
  font-style: normal;
  color: var(--accent);
}
.landing-sub {
  font-size: 15px;
  color: var(--text-sub);
  line-height: 1.8;
}
.landing-badges {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.badge {
  font-size: 12px;
  color: var(--accent);
  background: var(--accent-light);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-weight: 600;
}

/* --- Buttons --- */
.btn-primary {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  padding: 16px 32px;
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: transform 0.15s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { transform: scale(0.97); opacity: 0.9; }
.btn-primary:disabled { opacity: 0.4; pointer-events: none; }

.btn-line {
  background: #06C755;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  max-width: 100%;
}
.btn-line svg { width: 24px; height: 24px; flex-shrink: 0; }

.btn-outline {
  display: block;
  width: 100%;
  padding: 14px 24px;
  background: #fff;
  color: var(--text-sub);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}
.btn-outline:active { border-color: var(--accent); color: var(--accent); }

.btn-back {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 4px;
  -webkit-tap-highlight-color: transparent;
}
.btn-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* --- Question --- */
.q-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 24px;
  line-height: 1.5;
  color: var(--text);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.option {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.option:active, .option.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.option-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.option-text { flex: 1; }
.option-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.option-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* --- Car search (Q1) --- */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-input {
  width: 100%;
  padding: 14px 18px 14px 44px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  stroke: var(--text-dim);
  fill: none;
  stroke-width: 2;
}

.search-candidates {
  display: none;
  max-height: 280px;
  overflow-y: auto;
  margin-top: 8px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.search-candidates.open { display: block; }

.candidate-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
}
.candidate-item:last-child { border-bottom: none; }
.candidate-item:active { background: var(--accent-light); }
.candidate-car { font-size: 14px; font-weight: 500; color: var(--text); }
.candidate-maker { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.candidate-size {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-light);
  padding: 3px 10px;
  border-radius: 6px;
  flex-shrink: 0;
}
.search-no-result {
  padding: 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

.selected-car {
  display: none;
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.selected-car.show { display: flex; justify-content: space-between; align-items: center; }
.selected-car-info {}
.selected-car-name { font-size: 15px; font-weight: 600; color: var(--text); }
.selected-car-maker { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.selected-car-size {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}
.selected-car-clear {
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  margin-top: 8px;
  text-align: right;
}

.size-fallback {
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.size-fallback-label {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 12px;
}
.size-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.size-btn {
  padding: 12px 8px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.size-btn:active, .size-btn.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.size-btn-size {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
}
.size-btn-ex {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

.q1-next, .q3-next {
  margin-top: 20px;
}

/* --- Result --- */
.result-header {
  text-align: center;
  margin-bottom: 28px;
}
.result-header-label {
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.1em;
  font-weight: 600;
  margin-bottom: 8px;
}
.result-header-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
}

.result-card {
  background: #fff;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius);
  padding: 28px 24px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.result-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--accent);
}

.result-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
}
.result-badge.recommended {
  background: var(--accent);
  color: #fff;
}

.result-menu-name {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
}
.result-duration {
  font-size: 14px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 16px;
}
.result-desc {
  font-size: 14px;
  color: var(--text-sub);
  line-height: 1.8;
  margin-bottom: 20px;
}
.result-reason {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.8;
  background: var(--bg-light);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.result-reason em {
  font-style: normal;
  color: var(--accent);
  font-weight: 600;
}

.result-features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.feature-tag {
  font-size: 12px;
  color: var(--accent);
  background: var(--accent-light);
  border-radius: 6px;
  padding: 5px 12px;
  font-weight: 600;
}

.result-price-section {
  border-top: 1px solid var(--border);
  padding-top: 20px;
}
.result-price-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.result-price-label {
  font-size: 13px;
  color: var(--text-sub);
}
.result-price-value {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
}
.result-price-tax {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
}
.result-annual {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 16px;
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
  border-radius: 10px;
  margin-top: 12px;
}
.annual-label {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
}
.annual-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
}

.budget-note {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fef9e7;
  border: 1px solid #f0e0a0;
  border-radius: 10px;
  font-size: 12px;
  color: #7a6a1f;
  line-height: 1.6;
}

/* --- Premium suggestion --- */
.premium-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  margin-bottom: 20px;
  position: relative;
}
.premium-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 4px 12px;
  border-radius: 20px;
  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid var(--accent);
  margin-bottom: 14px;
}
.premium-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 10px;
}
.premium-desc {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.8;
  margin-bottom: 14px;
}
.premium-price-section {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 0;
  margin-bottom: 14px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.premium-price-label {
  font-size: 12px;
  color: var(--text-sub);
}
.premium-price-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
}
.premium-includes-section {
  margin-top: 4px;
}
.premium-includes-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 8px;
}
.premium-includes-title.store-exclusive {
  margin-top: 10px;
  color: var(--accent);
}
.premium-includes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}
.premium-includes-tag {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-light);
  border-radius: 5px;
  padding: 4px 10px;
  font-weight: 600;
}
.premium-includes-tag.exclusive {
  color: #b8860b;
  background: #fdf6e3;
}

/* --- Comparison --- */
.comparison {
  margin: 8px 0 28px;
}
.comparison-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}

.compare-card {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.compare-card.highlight {
  border-color: var(--accent);
  background: var(--accent-light);
}
.compare-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.compare-duration {
  font-size: 12px;
  color: var(--text-dim);
}
.compare-right { text-align: right; }
.compare-price {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.compare-annual {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
}
.compare-badge {
  font-size: 10px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  border-radius: 4px;
  padding: 2px 8px;
  margin-left: 8px;
}
.compare-over {
  font-size: 10px;
  color: #b8860b;
  margin-top: 2px;
}

/* --- CTA --- */
.cta-section {
  margin-top: 8px;
  padding: 24px 0 40px;
}
.cta-text {
  font-size: 14px;
  color: var(--text-sub);
  text-align: center;
  margin-bottom: 16px;
  line-height: 1.8;
}
.cta-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cta-note {
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  margin-top: 16px;
  background: var(--accent-light);
  padding: 8px 12px;
  border-radius: 8px;
}

.share-section {
  border-top: 1px solid var(--border);
  padding-top: 20px;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.share-text {
  font-size: 13px;
  color: var(--text-dim);
}

.footer {
  text-align: center;
  padding: 20px 0;
  margin-top: auto;
}
.footer-brand {
  font-size: 12px;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  font-weight: 600;
}
.footer-sub {
  font-size: 11px;
  color: #ccc;
  margin-top: 4px;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: 10px;
  opacity: 0;
  transition: transform 0.3s, opacity 0.3s;
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>
<div id="app">

  <!-- Landing -->
  <div class="screen landing active" id="screen-landing">

var allCars = [];
for (var maker in CAR_SIZES) {
  var cars = CAR_SIZES[maker];
  for (var car in cars) {
    allCars.push({ maker: maker, car: car, size: cars[car] });
  }
}

var searchInput = document.getElementById('carSearchInput');
var searchCandidates = document.getElementById('searchCandidates');

function searchCars(query) {
  if (!query.trim()) return [];
  var q = query.toLowerCase();
  return allCars.filter(function(c) {
    return c.car.toLowerCase().indexOf(q) !== -1 || c.maker.toLowerCase().indexOf(q) !== -1;
  }).sort(function(a, b) {
    var aName = a.car.toLowerCase();
    var bName = b.car.toLowerCase();
    var aRank = aName === q ? 0 : aName.indexOf(q) === 0 ? 1 : 2;
    var bRank = bName === q ? 0 : bName.indexOf(q) === 0 ? 1 : 2;
    return aRank - bRank;
  }).slice(0, 12);
}

searchInput.addEventListener('input', function() {
  var results = searchCars(this.value);
  if (!this.value.trim()) {
    searchCandidates.classList.remove('open');
    return;
  }
  if (results.length === 0) {
    searchCandidates.innerHTML = '<div class="search-no-result">該当する車種が見つかりませんでした</div>';
  } else {
    searchCandidates.innerHTML = results.map(function(c) {
      return '<div class="candidate-item" data-maker="' + c.maker + '" data-car="' + c.car + '" data-size="' + c.size + '">' +
        '<div><div class="candidate-car">' + c.car + '</div><div class="candidate-maker">' + c.maker + '</div></div>' +
        '<div class="candidate-size">' + c.size + '</div></div>';
    }).join('');
    searchCandidates.querySelectorAll('.candidate-item').forEach(function(el) {
      el.addEventListener('click', function() {
        selectCar(el.dataset.maker, el.dataset.car, el.dataset.size);

    });
  }
  searchCandidates.classList.add('open');
});

// === 診断ロジック ===
var MENU_ORDER = ['crystal', 'fresh', 'dia2', 'iron', 'ex'];

function calcScores() {
  var scores = { crystal: 0, fresh: 0, dia2: 0, iron: 0, ex: 0 };

  // Q2: 単一選択
  var q2Answer = state.answers.q2;
  var q2Opts = QUESTIONS.q2.options;
  for (var i = 0; i < q2Opts.length; i++) {
    if (q2Opts[i].value === q2Answer && q2Opts[i].scores) {
      MENU_ORDER.forEach(function(k) { scores[k] += q2Opts[i].scores[k] || 0; });
      break;
    }
  }

  // Q3: 複数選択 → 選んだ分だけ加点
  var q3Answers = state.answers.q3 || [];
  var q3Opts = QUESTIONS.q3.options;
  q3Answers.forEach(function(val) {
    for (var i = 0; i < q3Opts.length; i++) {
      if (q3Opts[i].value === val && q3Opts[i].scores) {
        MENU_ORDER.forEach(function(k) { scores[k] += q3Opts[i].scores[k] || 0; });
        break;
      }
    }
  });

  return scores;
}

function getRecommendation() {
  var scores = calcScores();
  var size = state.selectedSize || 'M';
  var budget = state.answers.q4 || 999999;

  MENU_ORDER.forEach(function(key) {
    var m = MENUS[key];
    var price = m.prices[size];
    var annual = calcAnnualCost(key, size);
    if (price <= budget) {
      scores[key] += 3;
    } else if (annual <= budget) {
      scores[key] -= 1;
    } else {
      scores[key] -= 5;
    }
  });

  var sorted = MENU_ORDER.slice().sort(function(a, b) { return scores[b] - scores[a]; });

  var hasBudgetFit = false;
  for (var i = 0; i < sorted.length; i++) {
    var m = MENUS[sorted[i]];
    var p = m.prices[size];
    var a = calcAnnualCost(sorted[i], size);
    if (p <= budget || a <= budget) {
      hasBudgetFit = true;
      break;
    }
  }
  if (!hasBudgetFit) {
    sorted = MENU_ORDER.slice();
  }

  return { primary: sorted[0], order: sorted, scores: scores };
}

  var premium = PREMIUM_INFO[rec.primary];
  if (premium) {
    var premiumPrice = premium.prices[size];
    html += '<div class="premium-card">';
    html += '<div class="premium-badge">こちらもおすすめ</div>';
    html += '<div class="premium-name">' + premium.name + '</div>';
    html += '<div class="premium-desc">' + premium.description + '</div>';
    html += '<div class="premium-price-section">';
    html += '<span class="premium-price-label">' + carName + '（' + size + '）</span>';
    html += '<span class="premium-price-value">' + fmt(premiumPrice) + '<span class="result-price-tax">（税込）</span></span>';
    html += '</div>';
    html += '<div class="premium-includes-section">';
    html += '<div class="premium-includes-title">含まれるサイドメニュー</div>';
    html += '<div class="premium-includes">';
    premium.includes.forEach(function(item) {
      html += '<span class="premium-includes-tag">' + item + '</span>';
    });
    html += '</div>';
    html += '<div class="premium-includes-title store-exclusive">＋ 店舗専用</div>';
    html += '<div class="premium-includes">';
    premium.storeExclusive.forEach(function(item) {
      html += '<span class="premium-includes-tag exclusive">' + item + '</span>';
    });
    html += '</div>';
    html += '</div>';
    html += '</div>';
  }

  // Comparison
  html += '<div class="comparison">';
  html += '<div class="comparison-title">5つのメニュー比較</div>';
  MENU_ORDER.forEach(function(key) {
    var m = MENUS[key];
    var p = m.prices[size];
    var a = calcAnnualCost(key, size);
    var isRec = key === rec.primary;
    html += '<div class="compare-card' + (isRec ? ' highlight' : '') + '">';
    html += '<div>';
    html += '<div class="compare-name">' + m.name + (isRec ? '<span class="compare-badge">おすすめ</span>' : '') + '</div>';
    html += '<div class="compare-duration">' + m.durationLabel + '</div>';
    if (p > budget) {
      html += '<div class="compare-over">↑ 予算超</div>';
    }
    html += '</div>';
    html += '<div class="compare-right">';
    html += '<div class="compare-price">' + fmt(p) + '</div>';
    html += '<div class="compare-annual">' + fmt(a) + ' / 年</div>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';

  // CTA
  html += '<div class="cta-section">';
  if (IS_FROM_LINE) {
    html += '<div class="cta-text">お車に合った正確なお見積もりをお出しします。<br>このLINEトークからお気軽にご相談ください。</div>';
    html += '<div class="cta-buttons">';
    html += '<button class="btn-outline" onclick="retake()">もう一度診断する</button>';
    html += '</div>';
  } else {
    html += '<div class="cta-text">お車に合った正確なお見積もりをお出しします。<br>お気軽にご相談ください。</div>';
    html += '<div class="cta-buttons">';
    html += '<a href="' + LINE_URL + '" target="_blank" rel="noopener" class="btn-primary btn-line" style="text-decoration:none">';
    html += '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 2.95 1.93 5.53 4.8 7.05L5.8 21.3c-.1.35.27.63.58.44l3.63-2.16c.65.1 1.31.17 1.99.17 5.52 0 10-3.82 10-8.5S17.52 2 12 2zm-3.28 10.81H6.84c-.33 0-.6-.27-.6-.6V8.5c0-.33.27-.6.6-.6s.6.27.6.6v3.11h1.28c.33 0 .6.27.6.6s-.27.6-.6.6zm2.08-.6c0 .33-.27.6-.6.6s-.6-.27-.6-.6V8.5c0-.33.27-.6.6-.6s.6.27.6.6v3.71zm4.96 0c0 .24-.14.45-.36.54-.07.03-.15.05-.24.05-.16 0-.31-.07-.42-.19l-1.96-2.67v2.27c0 .33-.27.6-.6.6s-.6-.27-.6-.6V8.5c0-.24.14-.45.36-.54.07-.03.15-.05.24-.05.16 0 .31.07.42.19l1.96 2.67V8.5c0-.33.27-.6.6-.6s.6.27.6.6v3.71zm3.28-.6h-1.88v-.88h1.28c.33 0 .6-.27.6-.6s-.27-.6-.6-.6h-1.28v-.92h1.88c.33 0 .6-.27.6-.6s-.27-.6-.6-.6h-2.48c-.33 0-.6.27-.6.6v3.71c0 .33.27.6.6.6h2.48c.33 0 .6-.27.6-.6s-.27-.56-.6-.56z"/></svg>';
    html += 'LINEで詳しく相談する</a>';
    html += '<button class="btn-outline" onclick="retake()">もう一度診断する</button>';
    html += '</div>';
  }
  html += '<div class="cta-note">施工中は代車を無料でお貸ししています</div>';
  html += '</div>';

  // Share
  html += '<div class="share-section">';
  html += '<div class="share-text">結果をシェア</div>';
  html += '<button class="btn-outline" onclick="shareResult()" style="max-width:240px;margin:0 auto">結果をコピーする</button>';
  html += '</div>';

  html += '<div class="footer">';
  html += '<div class="footer-brand">GRAYCIA</div>';
  html += '<div class="footer-sub">KeePer PRO SHOP 浜松店</div>';
  html += '</div>';

  document.getElementById('screen-result').innerHTML = html;
}

function retake() {
  state.answers = {};
  state.selectedMaker = null;
  state.selectedCar = null;
  state.selectedSize = null;
  clearCar();
  document.querySelectorAll('#options-q3 .option').forEach(function(o) { o.classList.remove('selected'); });
  document.getElementById('q3Next').disabled = true;
  showScreen('landing');
}

function shareResult() {
  var rec = getRecommendation();
  var menu = MENUS[rec.primary];
  var size = state.selectedSize || 'M';
  var price = menu.prices[size];
  var annual = calcAnnualCost(rec.primary, size);

  var text = 'コーティング診断の結果、私におすすめのメニューは「' + menu.name + '」(' + menu.durationLabel + ') でした!\n';
  text += '参考価格: ' + fmt(price) + '（年間' + fmt(annual) + '）\n\n';
  text += '診断はこちら:\n' + location.href;

  if (navigator.share) {
    navigator.share({ title: 'コーティング診断結果', text: text }).catch(function() {});
  } else {
    navigator.clipboard.writeText(text).then(function() {
      var t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }).catch(function() {});
  }
}

// 外部タップでドロップダウンを閉じる
document.addEventListener('click', function(e) {
  if (!e.target.closest('#carSearchSection')) {
    searchCandidates.classList.remove('open');
  }
});
</script>
