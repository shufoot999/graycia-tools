<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f8fb;
  --bg-card: #ffffff;
  --bg-light: #f2f8fb;
  --border: #dce8ee;
  --accent: #007f9f;
  --accent-dark: #006b88;
  --accent-light: #eaf6fa;
  --highlight: rgba(255, 213, 79, 0.35);
  /* ニュートラルは無彩色でなくアクセント寄りの青みを含ませる */
  --text: #14202b;
  --text-sub: #566674;
  --text-dim: #8a99a5;
  --shadow-card: 0 8px 24px rgba(17, 66, 92, 0.07);
  --radius: 16px;
}

html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  /* 画面上部にごく淡い光を置き、白背景の平坦さを避ける */
  background:
    radial-gradient(circle at 50% -10%, rgba(0,127,159,0.09), transparent 32rem),
    var(--bg);
  color: var(--text);
  min-height: 100%;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 440px;
  margin: 0 auto;
  padding: 0 22px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  box-shadow: 0 0 45px rgba(28, 65, 84, 0.06);
}

.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  padding: 24px 0;
  animation: fadeSlideIn 0.35s ease-out;
}
.screen.active { display: flex; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Progress --- */
.progress-bar {
  width: 100%;
  height: 4px;
  background: #e8eef1;
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 13px;
  color: var(--accent);
  font-weight: 800;
  margin-bottom: 9px;
  letter-spacing: 0.08em;
}

/* --- Landing --- */
.landing {
  justify-content: flex-start;
  align-items: center;
  text-align: center;
  gap: 26px;
  padding: 28px 0 20px;
}
.landing-brand {
  font-size: 19px;
  letter-spacing: 0.24em;
  text-indent: 0.24em;
  color: var(--accent-dark);
  font-weight: 800;
}
.landing-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.landing-logo {
  height: 56px;
  width: auto;
  display: block;
}
.landing-title {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.45;
  letter-spacing: -0.015em;
  color: var(--text);
}
.landing-title em {
  font-style: normal;
  color: var(--accent);
}
.landing-sub {
  font-size: 14px;
  color: var(--text-sub);
  line-height: 1.85;
}
.landing-badges {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
}
.landing-badge {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 6px;
  position: relative;
}
.landing-badge + .landing-badge::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 1px;
  background: var(--border);
}
.landing-badge-icon {
  color: var(--accent);
  line-height: 0;
}
.landing-badge-icon svg {
  width: 28px;
  height: 28px;
}
.landing-badge-text {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-sub);
  line-height: 1.5;
}
.landing-hero {
  width: 100%;
  border-radius: var(--radius);
  overflow: hidden;
  line-height: 0;
  background: var(--bg-light);
  aspect-ratio: 16 / 9;
}
.landing-hero img,
.landing-hero svg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* --- Buttons --- */
.btn-primary {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  min-height: 56px;
  padding: 15px 28px;
  background: linear-gradient(180deg, #0788a8 0%, #007b9b 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  letter-spacing: 0.05em;
  box-shadow: 0 10px 22px rgba(0,127,159,.18);
  transition: transform 0.15s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { transform: scale(0.97); opacity: 0.9; }
.btn-primary:disabled { opacity: 0.38; box-shadow: none; pointer-events: none; }

/* ラベルと矢印を両端に振り分けるヒーローボタン（ランディング用） */
.btn-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-right: 22px;
}
.btn-arrow {
  line-height: 0;
  flex-shrink: 0;
}
.btn-arrow svg {
  width: 18px;
  height: 18px;
}

.btn-line {
  background: #06C755;
  box-shadow: 0 10px 22px rgba(6,199,85,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  max-width: 100%;
}
.btn-line svg { width: 24px; height: 24px; flex-shrink: 0; }

.btn-outline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 50px;
  padding: 14px 24px;
  background: #fff;
  color: var(--text-sub);
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}
.btn-outline svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-outline:active { border-color: var(--accent); color: var(--accent); }

.btn-back {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 4px;
  -webkit-tap-highlight-color: transparent;
}
.btn-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* --- Question --- */
.q-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 25px;
  line-height: 1.4;
  letter-spacing: -0.02em;
  color: var(--text);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.option {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 72px;
  padding: 14px 15px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 5px 16px rgba(17,66,92,.035);
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.option:active, .option.selected {
  border-color: var(--accent);
  background: #eef8fb;
  box-shadow: 0 7px 20px rgba(0,127,159,.09), inset 0 0 0 1px rgba(0,127,159,.06);
}
.option-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.option-icon svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
/* 複数選択のチェックボックス。未選択は枠のみ、選択中はアクセント色で塗る */
.option-check {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: #fff;
  color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.option-check svg {
  width: 14px;
  height: 14px;
}
.option.selected .option-check {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.option-text { flex: 1; min-width: 0; }
.option-label {
  font-size: 15px;
  font-weight: 750;
  color: var(--text);
}
.option-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* --- Car search (Q1) --- */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-input {
  width: 100%;
  padding: 14px 18px 14px 44px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  stroke: var(--text-dim);
  fill: none;
  stroke-width: 2;
}

.search-candidates {
  display: none;
  max-height: 280px;
  overflow-y: auto;
  margin-top: 8px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.search-candidates.open { display: block; }

.candidate-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
}
.candidate-item:last-child { border-bottom: none; }
.candidate-item:active { background: var(--accent-light); }
.candidate-car { font-size: 14px; font-weight: 500; color: var(--text); }
.candidate-maker { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.candidate-size {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-light);
  padding: 3px 10px;
  border-radius: 6px;
  flex-shrink: 0;
}
.search-no-result {
  padding: 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

.selected-car {
  display: none;
  background: var(--accent-light);
  border: 1.5px solid var(--accent);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.selected-car.show { display: flex; justify-content: space-between; align-items: center; }
.selected-car-info {}
.selected-car-name { font-size: 15px; font-weight: 600; color: var(--text); }
.selected-car-maker { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.selected-car-size {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}
.selected-car-clear {
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  margin-top: 8px;
  text-align: right;
}

.size-fallback {
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.size-fallback-label {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 12px;
}
.size-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.size-btn {
  min-height: 82px;
  padding: 14px 7px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(17,66,92,.025);
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.size-btn.selected { box-shadow: 0 7px 18px rgba(0,127,159,.12); }
.size-btn:active, .size-btn.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.size-btn-size {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
.size-btn-ex {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

.q1-next, .q3-next {
  margin-top: 24px;
  position: sticky;
  bottom: 14px;
  z-index: 4;
}

/* --- Result --- */
.result-header {
  text-align: center;
  margin-bottom: 28px;
}
.result-header-label {
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 0.16em;
  font-weight: 800;
  margin-bottom: 8px;
}
.result-header-title {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.45;
  letter-spacing: -0.02em;
  color: var(--text);
}
/* ランディングの見出しと同じく、主題側だけアクセント色にする */
.result-header-title span { color: var(--accent); }

.result-card {
  background: #fff;
  border: 0;
  border-radius: 20px;
  padding: 26px 20px 22px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 14px 38px rgba(18,72,96,.12);
}
.result-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 5px;
  background: linear-gradient(90deg, #007f9f, #35a9c2);
}

.result-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
}
.result-badge.recommended {
  background: var(--accent);
  color: #fff;
}

.result-menu-name {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.03em;
}
.result-catchcopy {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.5;
  margin-bottom: 10px;
}
.result-duration {
  display: inline-flex;
  padding: 4px 9px;
  background: #eff8fb;
  border-radius: 7px;
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 17px;
}
.result-image {
  margin: 0 -20px 18px;
  overflow: hidden;
  background: var(--bg-light);
  line-height: 0;
}
.result-image img {
  width: 100%;
  height: auto;
  display: block;
}
.result-desc {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.85;
  margin-bottom: 20px;
}
.result-reason {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.8;
  background: linear-gradient(135deg, #eff8fb, #f7fbfd);
  border-left: 3px solid #68b5ca;
  border-radius: 12px;
  padding: 15px 16px;
  margin-bottom: 20px;
}
.result-reason em {
  font-style: normal;
  color: var(--accent);
  font-weight: 600;
}

/* 特徴は4つの正方形カード。アイコンとラベルを縦積みにして4列で並べる */
.result-features {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.feature-card {
  background: var(--accent-light);
  border-radius: 10px;
  padding: 12px 4px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}
.feature-card-icon {
  color: var(--accent);
  line-height: 0;
}
.feature-card-icon svg {
  width: 22px;
  height: 22px;
}
.feature-card-text {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.35;
  word-break: auto-phrase;
}

.result-price-section {
  border-top: 1px solid var(--border);
  padding-top: 20px;
}
.result-price-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.result-price-label {
  font-size: 13px;
  color: var(--text-sub);
}
.result-price-value {
  font-size: 25px;
  letter-spacing: -0.02em;
  font-weight: 800;
  color: var(--text);
}
.result-price-tax {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
}
.result-annual {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 15px;
  background: linear-gradient(135deg, #eef8fb, #e4f3f8);
  border: 1.5px solid var(--accent);
  border-radius: 13px;
  margin-top: 12px;
}
.annual-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: 1;
}
.annual-label {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
}
.annual-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1.3;
}
.annual-arrow {
  color: var(--accent);
  line-height: 0;
  flex-shrink: 0;
}
.annual-arrow svg {
  width: 18px;
  height: 18px;
}

.budget-note {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fef9e7;
  border: 1px solid #f0e0a0;

  color: var(--text);

  font-weight: 700;

.compare-right { text-align: right; }

  font-weight: 700;

}
.compare-over {
  font-size: 10px;
  color: #b8860b;

.cta-section {
  margin-top: 8px;

}

}

}

  background: var(--accent);

  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);

function calcAnnualCost(menuKey, size) {
  var m = MENUS[menuKey];
  var price = m.prices[size];

}

var state = {

// === ユーティリティ ===
function fmt(n) {
  return '¥' + Math.round(n).toLocaleString();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  var el = document.getElementById('screen-' + id);
  if (el) {
    el.classList.remove('active');
    void el.offsetWidth;
    el.classList.add('active');
  }
  window.scrollTo(0, 0);
}

function goBack(target) { showScreen(target); }

function startDiagnosis() {
  state.answers = {};
  state.selectedMaker = null;
  state.selectedCar = null;
  state.selectedSize = null;
  clearCar();
  document.querySelectorAll('#options-q3 .option').forEach(function(o) { o.classList.remove('selected'); });
  document.getElementById('q3Next').disabled = true;
  showScreen('q1');
}

// === Q1: 車種検索 ===
var allCars = [];
for (var maker in CAR_SIZES) {
  var cars = CAR_SIZES[maker];
  for (var car in cars) {
    allCars.push({ maker: maker, car: car, size: cars[car] });
  }
}

var searchInput = document.getElementById('carSearchInput');
var searchCandidates = document.getElementById('searchCandidates');

function searchCars(query) {
  if (!query.trim()) return [];
  var q = query.toLowerCase();
  return allCars.filter(function(c) {
    return c.car.toLowerCase().indexOf(q) !== -1 || c.maker.toLowerCase().indexOf(q) !== -1;
  }).sort(function(a, b) {
    var aName = a.car.toLowerCase();
    var bName = b.car.toLowerCase();
    var aRank = aName === q ? 0 : aName.indexOf(q) === 0 ? 1 : 2;
    var bRank = bName === q ? 0 : bName.indexOf(q) === 0 ? 1 : 2;
    return aRank - bRank;
  }).slice(0, 12);
}

searchInput.addEventListener('input', function() {
  var results = searchCars(this.value);
  if (!this.value.trim()) {
    searchCandidates.classList.remove('open');
    return;
  }
  if (results.length === 0) {
    searchCandidates.innerHTML = '<div class="search-no-result">該当する車種が見つかりませんでした</div>';
  } else {
    searchCandidates.innerHTML = results.map(function(c) {
      return '<div class="candidate-item" data-maker="' + c.maker + '" data-car="' + c.car + '" data-size="' + c.size + '">' +
        '<div><div class="candidate-car">' + c.car + '</div><div class="candidate-maker">' + c.maker + '</div></div>' +
        '<div class="candidate-size">' + c.size + '</div></div>';
    }).join('');
    searchCandidates.querySelectorAll('.candidate-item').forEach(function(el) {
      el.addEventListener('click', function() {
        selectCar(el.dataset.maker, el.dataset.car, el.dataset.size);
      });
    });
  }
  searchCandidates.classList.add('open');
});

function selectCar(maker, car, size) {
  state.selectedMaker = maker;
  state.selectedCar = car;
  state.selectedSize = size;
  searchInput.value = '';
  searchCandidates.classList.remove('open');

  document.getElementById('selectedCarName').textContent = car;
  document.getElementById('selectedCarMaker').textContent = maker;
  document.getElementById('selectedCarSize').textContent = size;
  document.getElementById('selectedCar').classList.add('show');

  document.getElementById('q1Next').disabled = false;

  document.querySelectorAll('.size-btn').forEach(function(b) { b.classList.remove('selected'); });
}

function selectOption(qId, value) {
  state.answers[qId] = value;

  }, 250);

// === Q3: 複数選択式 ===
function toggleQ3Option(value) {
  if (!state.answers.q3) state.answers.q3 = [];
  var idx = state.answers.q3.indexOf(value);
  if (idx === -1) {
    state.answers.q3.push(value);
  } else {
    state.answers.q3.splice(idx, 1);
  }
  document.querySelectorAll('#options-q3 .option').forEach(function(o) {
    var v = o.dataset.value;
    if (state.answers.q3.indexOf(v) !== -1) {
      o.classList.add('selected');
    } else {
      o.classList.remove('selected');
    }
  });
  document.getElementById('q3Next').disabled = state.answers.q3.length === 0;
}

// === 診断ロジック ===
var MENU_ORDER = ['crystal', 'fresh', 'dia2', 'iron', 'ex'];

function calcScores() {
  var scores = { crystal: 0, fresh: 0, dia2: 0, iron: 0, ex: 0 };

  // Q2: 単一選択
  var q2Answer = state.answers.q2;
  var q2Opts = QUESTIONS.q2.options;
  for (var i = 0; i < q2Opts.length; i++) {
    if (q2Opts[i].value === q2Answer && q2Opts[i].scores) {
      MENU_ORDER.forEach(function(k) { scores[k] += q2Opts[i].scores[k] || 0; });
      break;
    }
  }

  // Q3: 複数選択 → 選んだ分だけ加点
  var q3Answers = state.answers.q3 || [];
  var q3Opts = QUESTIONS.q3.options;
  q3Answers.forEach(function(val) {
    for (var i = 0; i < q3Opts.length; i++) {
      if (q3Opts[i].value === val && q3Opts[i].scores) {
        MENU_ORDER.forEach(function(k) { scores[k] += q3Opts[i].scores[k] || 0; });
        break;
      }
    }
  });

  return scores;
}

function getRecommendation() {
  var scores = calcScores();
  var size = state.selectedSize || 'M';
  var budget = state.answers.q4 || 999999;

  MENU_ORDER.forEach(function(key) {
    var m = MENUS[key];
    var price = m.prices[size];
    var annual = calcAnnualCost(key, size);
    if (price <= budget) {
      scores[key] += 3;
    } else if (annual <= budget) {
      scores[key] -= 1;
    } else {
      scores[key] -= 5;
    }
  });

  var sorted = MENU_ORDER.slice().sort(function(a, b) { return scores[b] - scores[a]; });

  var hasBudgetFit = false;
  for (var i = 0; i < sorted.length; i++) {
    var m = MENUS[sorted[i]];
    var p = m.prices[size];
    var a = calcAnnualCost(sorted[i], size);
    if (p <= budget || a <= budget) {
      hasBudgetFit = true;
      break;
    }
  }
  if (!hasBudgetFit) {
    sorted = MENU_ORDER.slice();
  }

  return { primary: sorted[0], order: sorted, scores: scores };
}

  if (state.selectedCar) {

function retake() {
  state.answers = {};
  state.selectedMaker = null;
  state.selectedCar = null;
  state.selectedSize = null;
  clearCar();
  document.querySelectorAll('#options-q3 .option').forEach(function(o) { o.classList.remove('selected'); });
  document.getElementById('q3Next').disabled = true;
  showScreen('landing');
}

function shareResult() {
  var rec = getRecommendation();
  var menu = MENUS[rec.primary];
  var size = state.selectedSize || 'M';
  var price = menu.prices[size];
  var annual = calcAnnualCost(rec.primary, size);

  var q2Label = '';
  QUESTIONS.q2.options.forEach(function(o) { if (o.value === state.answers.q2) q2Label = o.label; });
  var q3Labels = [];
  QUESTIONS.q3.options.forEach(function(o) { if ((state.answers.q3 || []).indexOf(o.value) !== -1) q3Labels.push(o.label); });
  var carName = getCarDisplayName();

  var text = '【コーティング診断結果】\n';
  text += 'お車: ' + carName + '（' + size + '）\n';
  text += '年式: ' + (q2Label || '-') + '\n';
  text += '気になること: ' + (q3Labels.join('・') || '-') + '\n';
  text += 'おすすめ: 「' + menu.name + '」(' + menu.durationLabel + ')\n';
  text += '参考価格: ' + fmt(price) + '（年間' + fmt(annual) + '）';

  function ksToast() {
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ksToast).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      ksToast();
    } catch (e) {}
  }
}

// 外部タップでドロップダウンを閉じる
document.addEventListener('click', function(e) {
  if (!e.target.closest('#carSearchSection')) {
    searchCandidates.classList.remove('open');
  }
});
